name: CD — Production

on:
  workflow_run:
    workflows: ["CD — Staging"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: production
  CLUSTER_NAME: ecommerce-production

jobs:
  canary-deploy:
    name: Canary Deploy & Verify
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: production   # manual approval gate configured in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Deploy canary (1 replica)
        run: |
          helm upgrade --install frontend-canary ./infrastructure/kubernetes/helm/frontend \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=1 \
            --set nameOverride=frontend-canary \
            -f ./infrastructure/kubernetes/helm/frontend/values-production.yaml

      - name: Monitor canary for 5 minutes
        run: sleep 300

      - name: Evaluate canary health
        id: canary
        run: |
          READY=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=frontend-canary \
            --field-selector=status.phase=Running -o json | jq '.items | length')
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Promote to full rollout
        if: steps.canary.outputs.ready == '1'
        run: |
          for chart in api-gateway product-service frontend; do
            helm upgrade --install "$chart" ./infrastructure/kubernetes/helm/$chart \
              --namespace ${{ env.K8S_NAMESPACE }} \
              --set image.tag=${{ github.sha }} \
              -f ./infrastructure/kubernetes/helm/$chart/values-production.yaml
          done
          helm uninstall frontend-canary -n ${{ env.K8S_NAMESPACE }}

      - name: Roll back canary on failure
        if: steps.canary.outputs.ready != '1'
        run: |
          helm uninstall frontend-canary -n ${{ env.K8S_NAMESPACE }}
          exit 1

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/api-gateway -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Notify Slack — success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Production deployment successful — ${{ github.sha }} by ${{ github.actor }}\"}"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: canary-deploy
    if: failure()
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Roll back frontend & api-gateway
        run: |
          kubectl rollout undo deployment/frontend -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/api-gateway -n ${{ env.K8S_NAMESPACE }}

      - name: Notify Slack — rollback
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"⚠️ Production deployment failed and was rolled back. Please investigate."}'
