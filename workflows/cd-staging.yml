name: CD — Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: staging
  CLUSTER_NAME: ecommerce-staging

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging   # requires manual approval if configured on the environment
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Deploy via Helm
        run: |
          for chart in api-gateway product-service frontend; do
            helm upgrade --install "$chart" ./infrastructure/kubernetes/helm/$chart \
              --namespace ${{ env.K8S_NAMESPACE }} --create-namespace \
              --set image.tag=${{ github.sha }} \
              -f ./infrastructure/kubernetes/helm/$chart/values-staging.yaml
          done

      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/frontend -n ${{ env.K8S_NAMESPACE }}

      - name: Run smoke tests
        run: ./infrastructure/scripts/run-smoke-tests.sh "https://api-staging.ecommerce.com"
