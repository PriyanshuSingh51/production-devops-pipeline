name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/pom.xml', '**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Lint frontend
        run: |
          if [ -d frontend ]; then cd frontend && npm ci && npm run lint; fi

      - name: Lint backend (Checkstyle)
        run: |
          for svc in */pom.xml; do
            dir=$(dirname "$svc")
            (cd "$dir" && mvn -q -B checkstyle:check) || true
          done

      - name: Unit tests — frontend
        run: |
          if [ -d frontend ]; then cd frontend && npm test -- --coverage --watchAll=false; fi

      - name: Unit tests — backend
        run: |
          for svc in */pom.xml; do
            dir=$(dirname "$svc")
            (cd "$dir" && mvn -q -B test)
          done

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality-gates]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push each service image
        run: |
          services=(api-gateway service-discovery config-server product-service \
                     order-service payment-service user-service inventory-service \
                     notification-service frontend)
          for svc in "${services[@]}"; do
            if [ -d "$svc" ]; then
              docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$svc:${{ github.sha }} ./$svc
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$svc:${{ github.sha }}
            fi
          done
