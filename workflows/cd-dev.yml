name: CD — Dev

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: dev
  CLUSTER_NAME: ecommerce-dev

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Deploy via Helm (auto, no approval gate)
        run: |
          for chart in api-gateway product-service frontend; do
            helm upgrade --install "$chart" ./infrastructure/kubernetes/helm/$chart \
              --namespace ${{ env.K8S_NAMESPACE }} --create-namespace \
              --set image.tag=${{ github.sha }} \
              -f ./infrastructure/kubernetes/helm/$chart/values-dev.yaml
          done

      - name: Wait for rollout
        run: kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/frontend --timeout=300s
