{{- if .Values.verticalPodAutoscaler.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "chart.fullname" . }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.verticalPodAutoscaler.updatePolicy.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {{- toYaml .Values.verticalPodAutoscaler.resourcePolicy.minAllowed | nindent 10 }}
        maxAllowed: {{- toYaml .Values.verticalPodAutoscaler.resourcePolicy.maxAllowed | nindent 10 }}
        controlledResources: ["cpu", "memory"]
{{- end }}
