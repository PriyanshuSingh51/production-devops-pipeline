replicaCount: 2

image:
  repository: ghcr.io/your-org/ecommerce-platform-api-gateway
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.ecommerce.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [api.ecommerce.com]
      secretName: api-ecommerce-tls

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: 500m, memory: 1Gi }

probes:
  liveness:  { path: /actuator/health/liveness,  initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 3 }
  readiness: { path: /actuator/health/readiness, initialDelaySeconds: 30, periodSeconds: 5,  failureThreshold: 3 }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  capabilities: { drop: [ALL] }
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

env:
  - name: EUREKA_SERVER
    valueFrom:
      configMapKeyRef: { name: platform-config, key: EUREKA_SERVER }
  - name: JWT_SIGNING_KEY
    valueFrom:
      secretKeyRef: { name: jwt-secret, key: JWT_SIGNING_KEY }
