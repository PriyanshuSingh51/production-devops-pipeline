# External Secrets Operator: syncs Vault paths into native Kubernetes Secrets
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: production
spec:
  provider:
    vault:
      server: "https://vault.ecommerce.internal:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ecommerce-production
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: application-secrets
  namespace: production
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: application-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: database-credentials, property: url }
    - secretKey: JWT_SECRET
      remoteRef: { key: auth, property: jwt-secret }
    - secretKey: STRIPE_KEY
      remoteRef: { key: apis, property: stripe-key }
    - secretKey: SENDGRID_KEY
      remoteRef: { key: apis, property: sendgrid-key }
